apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-session-mode
  namespace: argocd
spec:
  project: flink-mode-migration
  source:
    repoURL: https://github.com/1103461933/application-mode.git
    targetRevision: main
    path: charts/flink-lab
    helm:
      valueFiles:
        - values-session.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: session-mode-bridge-2l
  syncPolicy:
    automated:
      prune: false
      selfHeal: false

