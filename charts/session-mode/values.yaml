image:
  repository: REPLACE_ME_REGISTRY/flink-session
  tag: "2.2.0-dev"
flinkVersion: "2.2.0"
namespace: session-mode-bridge-2l
jobManager:
  replicas: 1
  cpuRequest: 250m
  memoryRequest: 512Mi
  cpuLimit: "1"
  memoryLimit: 2Gi
taskManager:
  replicas: 2
  cpuRequest: 250m
  memoryRequest: 512Mi
  cpuLimit: "1"
  memoryLimit: 2Gi


couchbase:
  secretName: couchbase-auth
  usernameSecretKey: username
  passwordSecretKey: password
