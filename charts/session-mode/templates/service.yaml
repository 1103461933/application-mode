apiVersion: v1
kind: Service
metadata:
  name: flink-session-jobmanager
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: flink-session
    component: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob
      port: 6124
      targetPort: 6124
    - name: rest
      port: 8081
      targetPort: 8081
