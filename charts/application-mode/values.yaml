image:
  repository: REPLACE_ME_REGISTRY/flink-reference-jobs
  tag: "2.2.0-dev"
flinkVersion: "2.2.0"
namespace: application-mode-bridge-2l
jobManager:
  replicas: 1
  cpuRequest: 500m
  memoryRequest: 1Gi
  cpuLimit: "2"
  memoryLimit: 4Gi
taskManager:
  replicas: 2
  cpuRequest: 500m
  memoryRequest: 1Gi
  cpuLimit: "2"
  memoryLimit: 4Gi
couchbase:
  secretName: couchbase-auth
  usernameSecretKey: username
  passwordSecretKey: password
