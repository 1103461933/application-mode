# PLACEHOLDER: replace args with the verified Flink 2.2.0 native Application Mode launch command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-application-jobmanager
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.jobManager.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flink-application
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink-application
        component: jobmanager
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: flink-application
      containers:
        - name: jobmanager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - standalone-job
            - --job-classname
            - org.apache.flink.client.python.PythonDriver
            - --
            - -py
            - /opt/flink/usrlib/application/src/application_entrypoint.py
          ports:
            - containerPort: 8081
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: flink-application-jobmanager
            - name: ENABLE_BUILT_IN_PLUGINS
              value: "flink-azure-fs-hadoop-2.2.0.jar"
            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.couchbase.secretName }}
                  key: {{ .Values.couchbase.usernameSecretKey }}
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.couchbase.secretName }}
                  key: {{ .Values.couchbase.passwordSecretKey }}
          resources:
            requests:
              cpu: {{ .Values.jobManager.cpuRequest | quote }}
              memory: {{ .Values.jobManager.memoryRequest | quote }}
            limits:
              cpu: {{ .Values.jobManager.cpuLimit | quote }}
              memory: {{ .Values.jobManager.memoryLimit | quote }}