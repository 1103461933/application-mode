apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-mode-quota
  namespace: {{ .Values.namespace }}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "4"
    requests.storage: 40Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-application
  namespace: {{ .Values.namespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
