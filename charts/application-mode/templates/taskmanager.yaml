apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-application-taskmanager
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.taskManager.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: flink-application
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink-application
        component: taskmanager
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: flink-application
      containers:
        - name: taskmanager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - taskmanager

          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-application-jobmanager

                taskmanager.memory.process.size: {{ .Values.taskManager.memoryProcessSize }}
                taskmanager.memory.jvm-metaspace.size: {{ .Values.taskManager.jvmMetaspaceSize }}

                fs.azure.account.auth.type.{{ .Values.azureStorage.accountName }}.dfs.core.windows.net: Custom
                fs.azure.account.oauth.provider.type.{{ .Values.azureStorage.accountName }}.dfs.core.windows.net: {{ .Values.azureStorage.providerClass }}


            - name: JOB_MANAGER_RPC_ADDRESS
              value: flink-application-jobmanager

            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.couchbase.secretName }}
                  key: {{ .Values.couchbase.usernameSecretKey }}

            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.couchbase.secretName }}
                  key: {{ .Values.couchbase.passwordSecretKey }}

          resources:
            requests:
              cpu: {{ .Values.taskManager.cpuRequest | quote }}
              memory: {{ .Values.taskManager.memoryRequest | quote }}
            limits:
              cpu: {{ .Values.taskManager.cpuLimit | quote }}
              memory: {{ .Values.taskManager.memoryLimit | quote }}
