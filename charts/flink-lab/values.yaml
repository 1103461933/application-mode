# Safe default: deploy Session Mode first. Application Mode stays disabled until migration approval.
sessionMode:
  enabled: true
  image:
    repository: xlen911/flink-reference-jobs
    tag: "2.2.0-dev"
  flinkVersion: "2.2.0"
  namespace: session-mode-bridge-2l
  jobManager:
    replicas: 1
    cpuRequest: 250m
    memoryRequest: 512Mi
    cpuLimit: "1"
    memoryLimit: 2Gi
  taskManager:
    replicas: 2
    cpuRequest: 250m
    memoryRequest: 512Mi
    cpuLimit: "1"
    memoryLimit: 2Gi
  jobs:
    equipmentAgregate:
      enabled: true
      specFile: equipment-agregate.yaml
    ssrAgregate:
      enabled: true
      specFile: ssr-agregate.yaml
    fareAgregate:
      enabled: true
      specFile: fare-agregate.yaml

applicationMode:
  enabled: false
  image:
    repository: xlen911/flink-reference-jobs
    tag: "2.2.1"
  flinkVersion: "2.2.0"
  namespace: application-mode-bridge-2l
  jobManager:
    replicas: 1
    cpuRequest: 500m
    memoryRequest: 1Gi
    cpuLimit: "2"
    memoryLimit: 4Gi
  taskManager:
    replicas: 2
    cpuRequest: 500m
    memoryRequest: 1Gi
    cpuLimit: "2"
    memoryLimit: 4Gi
  jobs:
    equipmentAgregate:
      enabled: true
      specFile: equipment-agregate.yaml
    ssrAgregate:
      enabled: true
      specFile: ssr-agregate.yaml
    fareAgregate:
      enabled: true
      specFile: fare-agregate.yaml

global:
  flinkVersion: "2.2.0"
  kafka:
    bootstrapServers: flight-kafka-kafka-bootstrap.stratos-rnd-dev.svc.cluster.local:9092
  couchbase:
    connectionString: couchbase://flight-couchbase-srv.stratos-rnd-dev.svc.cluster.local
    bucket: flight-reservations
    scope: reservations
  state:
    haBasePath: "abfss://application-mode-ha@flinkstorage911.dfs.core.windows.net/"
    checkpointBasePath: "abfss://application-mode-checkpoints@flinkstorage911.dfs.core.windows.net/"
    savepointBasePath: "abfss://application-mode-savapoints@flinkstorage911.dfs.core.windows.net/"





