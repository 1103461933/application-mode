apiVersion: v1
kind: Pod
metadata:
  name: flink-azure-diag
  namespace: application-mode-bridge-2l
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: flink-application
  restartPolicy: Never
  containers:
    - name: flink-azure-diag
      image: xlen911/flink-reference-jobs:2.2.15
      imagePullPolicy: Always
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
