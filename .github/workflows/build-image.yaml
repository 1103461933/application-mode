name: Build Flink reference jobs image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Image version (numeric format: X.Y.Z)"
        required: true
        type: string
        default: "2.2.1"

  push:
    branches:
      - main
    paths:
      - "application/flink/**"
      - ".github/workflows/build-image.yaml"

permissions:
  contents: write

concurrency:
  group: flink-gitops-main
  cancel-in-progress: false

jobs:
  build:
    name: Build, publish and update Application Mode
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # --------------------------------------------------
      # 2. Validate required configuration
      # --------------------------------------------------
      - name: Validate required configuration
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          test -n "$REGISTRY_USERNAME" || {
            echo "::error::REGISTRY_USERNAME is missing from environment dev"
            exit 1
          }

          test -n "$REGISTRY_TOKEN" || {
            echo "::error::REGISTRY_TOKEN is missing from environment dev"
            exit 1
          }

          test -n "$IMAGE_REGISTRY" || {
            echo "::error::IMAGE_REGISTRY is missing from environment dev"
            exit 1
          }

          echo "Required registry configuration is available."

      # --------------------------------------------------
      # 3. Determine image version
      # --------------------------------------------------
      - name: Determine image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.image_version }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            IMAGE_VERSION="$INPUT_VERSION"

            if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid image version. Use X.Y.Z, for example 2.2.2"
              exit 1
            fi
          else
            # Automatic builds use a numeric tag derived from the commit SHA.
            IMAGE_VERSION="2.2.0"

            SHA_NUMBER=$((16#${GIT_SHA:0:7}))
            IMAGE_VERSION="${IMAGE_VERSION}.${SHA_NUMBER}"
          fi

          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Image version: $IMAGE_VERSION"

      # --------------------------------------------------
      # 4. Set image repository
      # --------------------------------------------------
      - name: Set image repository
        id: image
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          IMAGE_REGISTRY="${IMAGE_REGISTRY%/}"
          IMAGE_REPOSITORY="${IMAGE_REGISTRY}/flink-reference-jobs"

          echo "repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "Image repository: $IMAGE_REPOSITORY"

      # --------------------------------------------------
      # 5. Login to container registry
      # --------------------------------------------------
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # --------------------------------------------------
      # 6. Build and push image
      # --------------------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./application/flink
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.version.outputs.image_version }}

      # --------------------------------------------------
      # 7. Install yq
      # --------------------------------------------------
      - name: Install yq
        run: |
          YQ_VERSION="v4.44.3"

          sudo curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

          yq --version

      # --------------------------------------------------
      # 8. Update Application Mode Helm values
      # --------------------------------------------------
      - name: Update Application Mode Helm values
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          VALUES_FILE="charts/flink-lab/values-application.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "::error::Helm values file not found: $VALUES_FILE"
            exit 1
          fi

          # Update only Application Mode image configuration.
          yq -i '
            .applicationMode.image.repository = strenv(IMAGE_REPOSITORY) |
            .applicationMode.image.tag = strenv(IMAGE_VERSION)
          ' "$VALUES_FILE"

          echo "Updated Application Mode image configuration:"
          yq '.applicationMode.image' "$VALUES_FILE"

          # Validate that Session Mode remains disabled.
          SESSION_MODE_ENABLED=$(yq -r '.sessionMode.enabled' "$VALUES_FILE")

          if [ "$SESSION_MODE_ENABLED" != "false" ]; then
            echo "::error::Session Mode must remain disabled in values-application.yaml"
            exit 1
          fi

          echo "Session Mode validation successful."

      # --------------------------------------------------
      # 9. Commit and push Helm values
      # --------------------------------------------------
      - name: Commit and push Helm values
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          VALUES_FILE="charts/flink-lab/values-application.yaml"
          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage Helm values changes.
          git add "$VALUES_FILE"

          # Skip commit if there are no changes.
          if git diff --cached --quiet; then
            echo "No Helm changes detected. Skipping GitOps commit."
            exit 0
          fi

          # Create GitOps commit.
          git commit -m "chore(gitops): deploy Application Mode image ${IMAGE_VERSION}"

          # Fetch latest changes from remote branch.
          echo "Fetching latest changes from origin/${BRANCH}..."

          git fetch origin "$BRANCH"

          # Rebase local commit on top of latest remote changes.
          echo "Rebasing local changes on top of origin/${BRANCH}..."

          if ! git rebase "origin/${BRANCH}"; then
            echo "::error::Git rebase failed. Possible conflict in Helm values."
            git rebase --abort || true
            exit 1
          fi

          # Push updated branch.
          echo "Pushing GitOps changes to origin/${BRANCH}..."

          git push origin "HEAD:${BRANCH}"

          echo "GitOps update published successfully."
          echo "Application Mode image version: ${IMAGE_VERSION}"
