name: Build Flink reference jobs image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "application/flink/**"
      - ".github/workflows/build-image.yaml"

jobs:
  build:
    name: Build and publish Flink image
    runs-on: ubuntu-latest

    # Load environment-scoped variables and secrets from GitHub Environment: dev
    environment: dev

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          test -n "$REGISTRY_USERNAME" || {
            echo "::error::REGISTRY_USERNAME is missing from environment dev"
            exit 1
          }

          test -n "$REGISTRY_TOKEN" || {
            echo "::error::REGISTRY_TOKEN is missing from environment dev"
            exit 1
          }

          test -n "$IMAGE_REGISTRY" || {
            echo "::error::IMAGE_REGISTRY is missing from environment dev"
            exit 1
          }

          echo "Required registry configuration is available."

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./application/flink
          push: true
          tags: ${{ vars.IMAGE_REGISTRY }}/flink-reference-jobs:2.2.0-${{ github.sha }}
