name: Build Flink reference jobs image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "application/flink/**"
      - ".github/workflows/build-image.yaml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.REGISTRY_USERNAME }}"
          test -n "${{ secrets.REGISTRY_TOKEN }}"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./application/flink
          push: true
          tags: ${{ vars.IMAGE_REGISTRY }}/flink-reference-jobs:2.2.0-${{ github.sha }}
