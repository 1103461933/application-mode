name: Build Flink reference jobs image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Image version (numeric format: X.Y.Z)"
        required: true
        type: string
        default: "2.2.8"

permissions:
  contents: write

# Serialize all executions of this workflow.
# Do not cancel an execution that is publishing or updating GitOps.
concurrency:
  group: flink-application-mode-main
  cancel-in-progress: false

jobs:
  build:
    name: Build, publish and update Application Mode
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # --------------------------------------------------
      # 2. Validate required configuration
      # --------------------------------------------------
      - name: Validate required configuration
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          set -euo pipefail

          test -n "$REGISTRY_USERNAME" || {
            echo "::error::REGISTRY_USERNAME is missing from environment dev"
            exit 1
          }

          test -n "$REGISTRY_TOKEN" || {
            echo "::error::REGISTRY_TOKEN is missing from environment dev"
            exit 1
          }

          test -n "$IMAGE_REGISTRY" || {
            echo "::error::IMAGE_REGISTRY is missing from environment dev"
            exit 1
          }

          echo "Required registry configuration is available."

      # --------------------------------------------------
      # 3. Determine and validate image version
      # --------------------------------------------------
      - name: Determine image version
        id: version
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid image version: $IMAGE_VERSION"
            echo "::error::Use numeric format X.Y.Z, for example 2.2.8"
            exit 1
          fi

          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Selected image version: $IMAGE_VERSION"

      # --------------------------------------------------
      # 4. Set image repository
      # --------------------------------------------------
      - name: Set image repository
        id: image
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          set -euo pipefail

          IMAGE_REGISTRY="${IMAGE_REGISTRY%/}"
          IMAGE_REPOSITORY="${IMAGE_REGISTRY}/flink-reference-jobs"

          echo "repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"

          echo "Image repository: $IMAGE_REPOSITORY"

      # --------------------------------------------------
      # 5. Login to container registry
      # --------------------------------------------------
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # --------------------------------------------------
      # 6. Build and push image
      # --------------------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./application/flink
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.version.outputs.image_version }}

      # --------------------------------------------------
      # 7. Install yq
      # --------------------------------------------------
      - name: Install yq
        run: |
          set -euo pipefail

          YQ_VERSION="v4.44.3"

          sudo curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

          yq --version

      # --------------------------------------------------
      # 8. Update Helm values and push GitOps changes
      # --------------------------------------------------
      - name: Update Helm values and push GitOps changes
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          set -euo pipefail

          VALUES_FILE="charts/flink-lab/values-application.yaml"
          BRANCH="main"
          MAX_RETRIES=5

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Validate the Helm values file exists.
          if [ ! -f "$VALUES_FILE" ]; then
            echo "::error::Helm values file not found: $VALUES_FILE"
            exit 1
          fi

          # Retry GitOps update if main changes concurrently.
          for ATTEMPT in $(seq 1 "$MAX_RETRIES"); do

            echo "------------------------------------------"
            echo "GitOps update attempt: $ATTEMPT/$MAX_RETRIES"
            echo "------------------------------------------"

            # Always start from the latest remote main.
            git fetch origin "$BRANCH"

            git reset --hard "origin/$BRANCH"

            # Validate Session Mode remains disabled.
            SESSION_MODE_ENABLED=$(yq -r '.sessionMode.enabled' "$VALUES_FILE")

            if [ "$SESSION_MODE_ENABLED" != "false" ]; then
              echo "::error::Session Mode must remain disabled."
              exit 1
            fi

            # Update only Application Mode image configuration.
            yq -i '
              .applicationMode.image.repository = strenv(IMAGE_REPOSITORY) |
              .applicationMode.image.tag = strenv(IMAGE_VERSION)
            ' "$VALUES_FILE"

            echo "Application Mode image configuration:"
            yq '.applicationMode.image' "$VALUES_FILE"

            # Validate Session Mode again after modification.
            SESSION_MODE_ENABLED=$(yq -r '.sessionMode.enabled' "$VALUES_FILE")

            if [ "$SESSION_MODE_ENABLED" != "false" ]; then
              echo "::error::Session Mode must remain disabled."
              exit 1
            fi

            # Stage only the Application Mode values file.
            git add "$VALUES_FILE"

            # Skip commit when the requested version is already deployed in Git.
            if git diff --cached --quiet; then
              echo "Helm values already contain version ${IMAGE_VERSION}."
              echo "No GitOps commit required."
              exit 0
            fi

            # Create GitOps commit.
            git commit -m \
              "chore(gitops): deploy Application Mode image ${IMAGE_VERSION}"

            # Push without force.
            # If another workflow updates main, retry from its latest state.
            if git push origin "HEAD:${BRANCH}"; then
              echo "------------------------------------------"
              echo "GitOps update published successfully."
              echo "Application Mode image: ${IMAGE_VERSION}"
              echo "------------------------------------------"
              exit 0
            fi

            echo "::warning::Push rejected. Another update may have changed main."

            # Discard the local commit and retry from latest remote state.
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              sleep $((ATTEMPT * 2))
            fi

          done

          echo "::error::Unable to update Helm values after ${MAX_RETRIES} attempts."
          exit 1
