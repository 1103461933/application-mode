apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-application
  namespace: application-mode
---
# Empty Role is deliberately not sufficient for deployment. Add only the
# namespace-scoped permissions required by the verified native deployment path.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-application
  namespace: application-mode
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-application
  namespace: application-mode
subjects:
  - kind: ServiceAccount
    name: flink-application
    namespace: application-mode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-application
