apiVersion: lab.example/v1
kind: FlinkReferenceJobs

spec:
  metadata:
    domain: bridge
    tenant: 2l

  flinkVersion: "2.2.0"

  parallelism: 1
  checkpointIntervalMs: 30000

  state:
    backend: rocksdb
    checkpointStorage: filesystem
    incrementalCheckpoints: true

  jobs:
    - name: equipment-agregate
      enabled: true
      inputTopic: "2l.bridge.equipment"
      outputCollection: equipment
      parallelism: 1
      checkpointIntervalMs: 30000
      checkpointDir: "abfss://application-mode-checkpoints@flinkstorage911.dfs.core.windows.net/bridge-2l/equipment-agregate"
      savepointDir: "abfss://application-mode-savepoints@flinkstorage911.dfs.core.windows.net/bridge-2l/equipment-agregate"

    - name: ssr-agregate
      enabled: true
      inputTopic: "2l.bridge.ssr"
      outputCollection: ssr
      parallelism: 1
      checkpointIntervalMs: 30000
      checkpointDir: "abfss://application-mode-checkpoints@flinkstorage911.dfs.core.windows.net/bridge-2l/ssr-agregate"
      savepointDir: "abfss://application-mode-savepoints@flinkstorage911.dfs.core.windows.net/bridge-2l/ssr-agregate"

    - name: fare-agregate
      enabled: true
      inputTopic: "2l.bridge.fare"
      outputCollection: fare
      parallelism: 1
      checkpointIntervalMs: 30000
      checkpointDir: "abfss://application-mode-checkpoints@flinkstorage911.dfs.core.windows.net/bridge-2l/fare-agregate"
      savepointDir: "abfss://application-mode-savepoints@flinkstorage911.dfs.core.windows.net/bridge-2l/fare-agregate"

  kafka:
    bootstrapServers: "flight-kafka-kafka-bootstrap.stratos-rnd-dev.svc.cluster.local:9092"

  couchbase:
    connectionString: "couchbase://flight-couchbase-srv.stratos-rnd-dev.svc.cluster.local"
    usernameSecretEnv: "COUCHBASE_USERNAME"
    passwordSecretEnv: "COUCHBASE_PASSWORD"
    bucket: "flight-reservations"
    scope: "reservations"